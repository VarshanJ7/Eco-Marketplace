<!DOCTYPE >
<html>
<head>
    <link rel = "stylesheet" href="../styles/home_page.css">

     <!--bootstrap css-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous"> 

  <title>EcoMarketplace Login</title>


  <style>
   @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap');

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #dff0d8, #fce7c0); /* subtle eco-green gradient */
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  flex-direction: column;
}

.header {
  width: 100%;
  background-color: #fce7c0;
  display: flex;
  justify-content: space-between;
  padding: 10px 30px;
  align-items: center;
  border-bottom: 1px solid black;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 999;
}

.title {
  font-size: 20px;
  font-weight: bold;
  color: green;
  text-decoration: none;
}

.login-container {
  background-color: #ffffffcc; /* semi-transparent white */
  width: 420px;
  padding: 40px 30px;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 120px;
  backdrop-filter: blur(4px);
}

.logo p {
  font-size: 28px;
  font-weight: bold;
  color: green;
  margin-bottom: 25px;
  letter-spacing: 1.5px;
  text-shadow: 1px 1px 2px #ccc;
}

.logo p::before {
  content: "🌿 ";
}

input[type="email"],
input[type="password"] {
  width: 100%;
  padding: 18px 20px;
  margin-bottom: 25px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 18px;
  box-shadow: none;
  transition: border 0.3s;
}

input[type="email"]:focus,
input[type="password"]:focus {
  border-color: #88cc88;
  outline: none;
}


button {
  margin-top: 10px;
  width: 100%;
  padding: 14px;
  background-color: #2d6a4f;
  color: white;
  font-weight: bold;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  transition: background-color 0.3s;
}

button:hover {
  background-color: #1b4332;
}



  </style>
</head>







<body>

  <div class="header"> 

 
    <div class="left-section">  <a href = "home_page.html" class="title">ECOMARKETPLACE </a>  </div>
    
    
    <div class="middle-section"> 
        <div class="dropdown">
          <p class="dropdown-toggle m-0" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer; margin: 0;">
            Browse items
          </p>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="kitchen.html">Kitchen</a></li>
            <li><a class="dropdown-item" href="clothes.html">Clothes</a></li>
            <li><a class="dropdown-item" href="#">Others</a></li>
          </ul>
        </div>
      
        <a href="swap.html"  style="cursor: pointer;  color: black; ">
          Swap offers
        </a>
        
    
    
        <div class="dropdown">
            <p class="dropdown-toggle m-0" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer; margin: 0;">Add item</p>
            <ul class="dropdown-menu p-4" style="min-width: 300px;">
              <form  id="add-item-form"  enctype="multipart/form-data" >
                <div class="mb-2">
                  <label class="form-label">Item Name</label>
                  <input type="text" class="form-control" id="item-name" placeholder="Enter item name">
                </div>
                <div class="mb-2">
                  <label class="form-label">Item Value (RM)</label>
                  <input type="number" class="form-control" id="item-price" placeholder="Enter value">
                </div>
                <div class="mb-2">
                  <label class="form-label" >Purpose</label>
                  <select class="form-select" id="item-purpose">
                    <option value="Swap">Swap</option>
                    <option value="Sell">Sell</option>
                  </select>
                </div>
                <div class="mb-2">
                    <label class="form-label" >Type</label>
                    <select class="form-select" id="item-type">
                      <option value="Kitchen">Kitchen</option>
                      <option value="Clothes">Clothes</option>
                      <option value="Others">Others</option>
                    </select>
                  </div>
                <div class="mb-2">
                  <label class="form-label">WhatsApp Number</label>
                  <input type="tel" class="form-control"  id="item-number" placeholder="e.g. 0123456789">
                </div>
                <div class="mb-3">
                  <label class="form-label">Upload Item Image</label>
                  <input type="file" class="form-control" accept="image/*" name="item_image"  id="item-image" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Submit</button>
              </form>
            </ul>
          </div>
          
       
    
    
    
      </div>
    
    
    
    <div class="right-section"> <a href="login.html">
      <img src="../images/profile.svg" class="profile-icon" alt="Profile">
    </a>
     <img src="../images/cart.svg" class ="cart-icon"> </div>
    
    
    
    
    
    
    
    </div>





  <div class="login-container">
    <div class="logo">
      <p>ECOMARKETPLACE</p>
    </div>

    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="password" placeholder="Password">
    <button type="submit">Login</button>
  </div>




  <script src="../script/general.js"> </script> <!--load general first -->

  <!--bootstrap js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>

</body>
</html>

<!DOCTYPE html>


<html> 



<head> 

    <!--bootstrap css-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous"> 

<link rel = "stylesheet" href="../styles/home_page.css">






</head>





<body > <!--by default has margin 8px-->

   

  




<div class="header"> 

 
<div class="left-section"> <p class="title">ECOMARKETPLACE </p>  </div>


<div class="middle-section"> 
    <div class="dropdown">
      <p class="dropdown-toggle m-0" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer; margin: 0;">
        Browse items
      </p>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#">Kitchen</a></li>
        <li><a class="dropdown-item" href="clothes.html">Clothes</a></li>
        <li><a class="dropdown-item" href="#">Others</a></li>
      </ul>
    </div>
  
    <p>Swap offers</p> 


    <div class="dropdown">
        <p class="dropdown-toggle m-0" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer; margin: 0;">Add item</p>
        <ul class="dropdown-menu p-4" style="min-width: 300px;">
          <form  id="add-item-form"  enctype="multipart/form-data" >
            <div class="mb-2">
              <label class="form-label">Item Name</label>
              <input type="text" class="form-control" id="item-name" placeholder="Enter item name">
            </div>
            <div class="mb-2">
              <label class="form-label">Item Value (RM)</label>
              <input type="number" class="form-control" id="item-price" placeholder="Enter value">
            </div>
            <div class="mb-2">
              <label class="form-label" >Purpose</label>
              <select class="form-select" id="item-purpose">
                <option value="Swap">Swap</option>
                <option value="Sell">Sell</option>
              </select>
            </div>
            <div class="mb-2">
                <label class="form-label" >Type</label>
                <select class="form-select" id="item-type">
                  <option value="Kitchen">Kitchen</option>
                  <option value="Clothes">Clothes</option>
                  <option value="Others">Others</option>
                </select>
              </div>
            <div class="mb-2">
              <label class="form-label">WhatsApp Number</label>
              <input type="tel" class="form-control"  id="item-number" placeholder="e.g. 0123456789">
            </div>
            <div class="mb-3">
              <label class="form-label">Upload Item Image</label>
              <input type="file" class="form-control" accept="image/*" name="item_image"  id="item-image" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Submit</button>
          </form>
        </ul>
      </div>
      
   



  </div>



<div class="right-section"> <img src="../images/profile.png" class="profile-icon"> <img src="../images/cart.png" class ="cart-icon"> </div>







</div>


<div class="middle-page"> <div class="big-title"><p>
    <span style="color: green;">Shop Sustainably,</span><br>
    <span style="color: blue;">Student-to-Student</span>
  </p></div>


  <div class="woman-container"><img src="../images/lady.png" class="woman-pic"> </div></div>








<div class="home-bottom"> 

  <div class="card" style="width: 14rem;">
    <img src="../images/bottle.svg" class="card-img-top" alt="...">
    <div class="card-body">
      <p class="card-text">Buy items</p>
    </div>
  </div>


  <div class="card mb-3" style="max-width: 450px;">
    <div class="row g-0">
      <div class="col-md-4">
        <img src="../images/swap.jpeg" class class="img-fluid rounded-start" alt="...">
      </div>
      <div class="col-md-8 d-flex align-items-center">
        <div class="card-body "  style="margin-left: 70px;">
            
          <h5 class="card-title">Swap Offers</h5>
          <p class="card-text">Exchange your items </p>
          <p class="card-text"><small class="text-body-secondary"></small></p>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="width: 14rem;">
    <img src="../images/earth.svg" class="card-img-top" alt="...">
    <div class="card-body">
      <p class="card-text">Search Filters</p>
    </div>
  </div>

</div>
  










<!--bootstrap js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>




</html>
